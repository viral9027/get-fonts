<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"/>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .form-container {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 20px;
            max-width: 450px;
            width: 90%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-container img.logo {
            width: 100px;
            margin-bottom: 20px;
            transition: transform 0.3s ease;
        }

        .form-container img.logo:hover {
            transform: scale(1.1);
        }

        h2 {
            color: #fff;
            font-weight: 600;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            border: none;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            color: #333;
            transition: background 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            background: rgba(255, 255, 255, 1);
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(90deg, #007bff, #00ddeb);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }

        .error {
            color: #ff4d4d;
            margin-top: 15px;
            font-size: 0.9rem;
        }

        @media (max-width: 500px) {
            .form-container {
                padding: 20px;
                width: 95%;
            }

            h2 {
                font-size: 1.5rem;
            }

            button {
                font-size: 1rem;
                padding: 12px;
            }
        }
    </style>
</head>
<body>
<div class="form-container">
    <img src="https://media.istockphoto.com/id/1345681613/vector/creative-people-logo-vector-illustration-design-editable-resizable-eps-10.jpg?s=612x612&w=0&k=20&c=9XUHICA1ljbxBcLw8ERp0kDDxLNQ8Bp2yR4aUSS6SBs="
         alt="Logo" class="logo"/>
    <h2>Font Extractor</h2>
    <h2>Welcome Back</h2>
    <form id="login-form">
        <input type="text" id="username" name="username" placeholder="Username" required/>
        <input type="password" id="password" name="password" placeholder="Password" required/>
        <button type="submit">Login</button>
    </form>
    <div id="error-message" class="error"></div>
</div>

<script>
    document.getElementById("login-form").addEventListener("submit", async function (event) {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const errorMessage = document.getElementById("error-message");

        const formData = new FormData();
        formData.append("username", username);
        formData.append("password", password);
        console.log(formData);
        try {
            const response = await fetch("/api/login", {
                method: "POST",
                body: formData,
            });

            const data = await response.json();
            if (data.status === "success") {
                window.location.href = data.redirect;
            } else {
                errorMessage.textContent = data.message || "Login failed";
            }
        } catch (error) {
            console.error("Error:", error);
            errorMessage.textContent = "An error occurred during login";
        }
    });
</script>
</body>
</html>
